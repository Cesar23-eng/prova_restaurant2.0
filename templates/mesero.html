<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a5276" />
  <title>PROVA - Mesero</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --primary: #1a5276;
      --primary-soft: #eaf2ff;
      --accent: #e67e22;
      --success: #27ae60;
      --danger: #c0392b;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --border: #dddddd;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    header {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header small { font-size: 0.8rem; opacity: 0.8; }
    #header-mesa { font-weight: 700; font-size: 0.9rem; text-align: right; }
    .steps { display: flex; gap: 6px; margin-top: 10px; }
    .step {
      flex: 1; text-align: center; padding: 5px 4px; border-radius: 20px;
      font-size: 0.72rem; color: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .step.active { background: #fff; color: var(--primary); font-weight: 700; }
    .step.done { background: var(--success); border-color: var(--success); color: #fff; }
    #offline {
      background: var(--danger); color: #fff; text-align: center;
      font-size: 0.8rem; padding: 6px;
    }

    main { padding: 14px 14px 110px; max-width: 720px; margin: 0 auto; }
    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; overflow: hidden;
    }
    .card-header {
      background: var(--primary); color: #fff; padding: 11px 14px;
      font-weight: 600; font-size: 0.95rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-body { padding: 14px; }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .center { text-align: center; }

    .btn {
      display: block; width: 100%; padding: 14px; border: none;
      border-radius: var(--radius); font-size: 1rem; font-weight: 700;
      text-align: center; margin-top: 10px; transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-small {
      width: auto; display: inline-block; margin: 0; padding: 6px 12px;
      font-size: 0.85rem; border-radius: 20px; background: rgba(255,255,255,0.2); color: #fff;
    }

    input[type=text], input[type=password], input[type=search], input[inputmode] {
      width: 100%; padding: 12px; border: 2px solid var(--border);
      border-radius: 10px; background: #fff; font-size: 1rem;
    }
    input:focus { outline: none; border-color: var(--primary); }

    /* PIN */
    .pin-input { font-size: 1.6rem !important; letter-spacing: 0.5em; text-align: center; }

    /* MESAS */
    .mesa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .mesa-btn {
      background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
      padding: 12px 8px; text-align: center; font-weight: 600; transition: transform 0.15s;
      display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 104px;
    }
    .mesa-btn:active { transform: scale(0.95); }
    .mesa-btn.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .mesa-btn:disabled { opacity: 0.45; border-color: var(--success); color: var(--success); }
    .mesa-icon { font-size: 1.5rem; }
    .mesa-num { font-size: 0.72rem; color: var(--muted); }
    .mesa-name { font-size: 0.95rem; word-break: break-word; }
    .mesa-meta { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
    .new-mesa-form { display: grid; gap: 10px; margin-top: 12px; }
    .segmented { display: flex; gap: 8px; }
    .segmented button {
      flex: 1; padding: 10px; border-radius: 10px; border: 2px solid var(--border);
      background: #fff; font-weight: 600; font-size: 0.9rem;
    }
    .segmented button.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }

    /* MENU */
    .sticky-tools {
      position: sticky; top: var(--header-h, 104px); z-index: 50; background: var(--bg);
      padding: 4px 0 8px; margin: -4px 0 4px;
    }
    .cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      white-space: nowrap; padding: 8px 16px; border-radius: 20px; border: 2px solid var(--border);
      background: var(--surface); font-size: 0.85rem; font-weight: 600; color: var(--muted);
    }
    .cat-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .platillo-list { display: flex; flex-direction: column; gap: 10px; }
    .platillo-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); }
    .platillo-name { padding: 11px 14px 2px; font-weight: 700; }
    .platillo-cat { font-size: 0.72rem; color: var(--muted); font-weight: 500; margin-left: 6px; }
    .variante-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 12px; }
    .variante-btn {
      position: relative; padding: 8px 12px; border-radius: 20px; border: 2px solid var(--border);
      background: var(--bg); font-size: 0.85rem; display: flex; align-items: center; gap: 6px;
      transition: transform 0.1s;
    }
    .variante-btn:active { transform: scale(0.94); }
    .variante-btn.flash { background: var(--success); color: #fff; border-color: var(--success); }
    .precio-tag { font-size: 0.75rem; opacity: 0.75; }
    .count-badge {
      position: absolute; top: -8px; right: -6px; background: var(--accent); color: #fff;
      border-radius: 10px; min-width: 20px; height: 20px; font-size: 0.72rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; padding: 0 5px;
    }

    /* CARRITO */
    .line { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .line:last-child { border-bottom: none; }
    .line-top { display: flex; align-items: center; gap: 10px; }
    .line-name { flex: 1; font-weight: 600; font-size: 0.95rem; }
    .line-name small { display: block; color: var(--muted); font-weight: 400; }
    .line-price { font-weight: 700; color: var(--primary); white-space: nowrap; }
    .qty { display: flex; align-items: center; gap: 6px; }
    .qty button {
      width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border);
      background: #fff; font-size: 1.1rem; font-weight: 700; line-height: 1;
    }
    .qty span { min-width: 22px; text-align: center; font-weight: 700; }
    .note-input { margin-top: 8px; padding: 8px 10px !important; font-size: 0.88rem !important; }
    .note-tag { color: var(--accent); font-size: 0.82rem; font-style: italic; }

    /* PLATOS */
    .plate-bar { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-top: 8px; scrollbar-width: none; }
    .plate-bar::-webkit-scrollbar { display: none; }
    .plate-bar-label { font-size: 0.85rem; font-weight: 700; white-space: nowrap; }
    .plate-chip {
      min-width: 40px; padding: 7px 12px; border-radius: 20px; border: 2px solid var(--accent);
      background: var(--surface); color: var(--accent); font-weight: 700; font-size: 0.85rem; white-space: nowrap;
    }
    .plate-chip.active { background: var(--accent); color: #fff; }
    .plate-chip.plate-new { border-style: dashed; }
    .plate-hint { font-size: 0.75rem; color: var(--muted); padding-top: 4px; }
    .plate-header {
      margin: 12px 0 2px; padding: 6px 10px; border-radius: 8px; background: #fdf0e6;
      color: var(--accent); font-weight: 800; font-size: 0.9rem;
    }
    .plate-header:first-child { margin-top: 0; }
    .line-bottom { display: flex; gap: 8px; margin-top: 8px; }
    .line-bottom .note-input { margin-top: 0; flex: 1; min-width: 0; }
    .plate-select {
      padding: 6px; border: 2px solid var(--accent); border-radius: 10px; background: #fff;
      font-weight: 700; color: var(--accent); font-size: 0.85rem;
    }
    .total-row {
      display: flex; justify-content: space-between; font-size: 1.1rem;
      font-weight: 700; padding-top: 12px; color: var(--primary);
    }

    /* FAB / TOAST */
    #fab-carrito {
      position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 16px;
      background: var(--accent); color: #fff; border: none; border-radius: 50px;
      padding: 14px 20px; font-size: 1rem; font-weight: 700;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 8px; z-index: 200;
    }
    #fab-badge {
      background: #fff; color: var(--accent); border-radius: 12px; min-width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 900; padding: 0 6px;
    }
    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(40px);
      background: #2c3e50; color: #fff; padding: 12px 22px; border-radius: 24px; opacity: 0;
      pointer-events: none; font-size: 0.9rem; transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 999; max-width: 90vw; text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.success { background: var(--success); }
    #toast.error { background: var(--danger); }
  </style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <h1>🌮 PROVA</h1>
      <small>Toma de pedidos</small>
    </div>
    <div id="header-mesa"></div>
  </div>
  <div class="steps" id="steps">
    <div class="step active" id="step1">1. Mesa</div>
    <div class="step" id="step2">2. Platillos</div>
    <div class="step" id="step3">3. Enviar</div>
  </div>
</header>
<div id="offline" hidden>Sin conexión con la caja. Revisa el WiFi.</div>

<main>
  <!-- ============ PIN ============ -->
  <section class="screen" id="screen-pin" hidden>
    <div class="card">
      <div class="card-header">Ingresa el PIN de meseros</div>
      <div class="card-body">
        <p class="muted" style="margin-bottom:12px">El PIN aparece en la barra inferior de la caja.</p>
        <form id="pin-form">
          <input id="pin-input" class="pin-input" type="password" inputmode="numeric"
                 autocomplete="off" maxlength="8" placeholder="••••" />
          <button class="btn btn-primary" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ MESAS ============ -->
  <section class="screen" id="screen-mesa" hidden>
    <div class="card">
      <div class="card-header">
        <span>Selecciona la mesa</span>
        <button class="btn btn-small" id="btn-refresh" type="button">↻ Actualizar</button>
      </div>
      <div class="card-body">
        <div class="mesa-grid" id="mesa-grid"><p class="muted">Cargando mesas...</p></div>
        <button class="btn btn-outline" id="btn-new-mesa" type="button">＋ Nueva mesa / cliente</button>
        <form class="new-mesa-form" id="new-mesa-form" hidden>
          <input id="new-mesa-name" type="text" maxlength="40" placeholder="Ej: Mesa 5, Juan, Terraza 2" />
          <div class="segmented" id="new-mesa-type">
            <button type="button" class="active" data-tipo="En el local">🍽️ En el local</button>
            <button type="button" data-tipo="Para llevar">🛵 Para llevar</button>
          </div>
          <button class="btn btn-primary" type="submit" style="margin-top:0">Crear y tomar pedido</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ MENU ============ -->
  <section class="screen" id="screen-menu" hidden>
    <div class="sticky-tools">
      <input id="search" type="search" placeholder="🔍 Buscar: taco, horchata, birria..." autocomplete="off" />
      <div class="cat-tabs" id="cat-tabs"></div>
      <div class="plate-bar" id="plate-bar"></div>
      <div class="plate-hint" id="plate-hint"></div>
    </div>
    <div class="platillo-list" id="platillo-list"></div>
    <button class="btn btn-outline" type="button" data-go="screen-mesa">← Cambiar de mesa</button>
  </section>

  <!-- ============ CARRITO ============ -->
  <section class="screen" id="screen-carrito" hidden>
    <div class="card">
      <div class="card-header"><span>Nuevo para enviar</span><span id="cart-count"></span></div>
      <div class="card-body" id="carrito-body"></div>
    </div>
    <div class="card" id="current-order-card" hidden>
      <div class="card-header"><span>Ya pedido en esta mesa</span><span id="current-order-total"></span></div>
      <div class="card-body" id="current-order-body"></div>
    </div>
    <button class="btn btn-outline" type="button" data-go="screen-menu">← Agregar más platillos</button>
    <button class="btn btn-success" id="btn-enviar" type="button">✅ Enviar a la caja</button>
  </section>
</main>

<button id="fab-carrito" type="button" hidden>🛒 Ver pedido <span id="fab-badge">0</span></button>
<div id="toast" role="status" aria-live="polite"></div>

<script>
  const STORAGE_KEY = 'prova-mesero-v2';
  const REQUEST_TIMEOUT_MS = 10000;
  const REFRESH_MS = 8000;

  const state = {
    pin: '',
    menu: {},
    mesas: [],
    mesa: null,
    cart: [],          // [{categoria, platillo, variante, precio, nota, cantidad, plato}]
    requestId: null,   // se reutiliza en reintentos para no duplicar el pedido
    categoria: null,
    plato: 1,          // plato al que van los platillos que se tocan (0 = sin plato)
    platosMesa: [],    // platos que la mesa ya tiene en la caja
    ajustes: { categorias_sin_plato: [], max_platos: 30 },
    newMesaTipo: 'En el local',
    screen: 'screen-mesa',
  };

  const $ = (id) => document.getElementById(id);

  // Crea elementos sin innerHTML: los nombres vienen de la caja y del Excel
  function h(tag, props = {}, ...children) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === 'class') el.className = value;
      else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
      else if (key in el) el[key] = value;
      else el.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      el.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return el;
  }

  const money = (n) => 'Bs ' + Number(n).toFixed(2);

  // ============ PERSISTENCIA LOCAL ============
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        pin: state.pin, mesa: state.mesa, cart: state.cart, requestId: state.requestId,
        plato: state.plato,
      }));
    } catch (e) { /* modo privado: se sigue sin guardar */ }
  }

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      state.pin = saved.pin || '';
      state.mesa = saved.mesa || null;
      state.cart = Array.isArray(saved.cart) ? saved.cart : [];
      state.requestId = saved.requestId || null;
      state.plato = Number.isInteger(saved.plato) ? saved.plato : 1;
    } catch (e) { /* datos viejos o corruptos */ }
  }

  // ============ API ============
  class ApiError extends Error {
    constructor(message, status) { super(message); this.status = status; }
  }

  async function api(path, options = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
    try {
      const res = await fetch(path, {
        ...options,
        signal: controller.signal,
        headers: { 'Content-Type': 'application/json', 'X-PIN': state.pin, ...(options.headers || {}) },
      });
      setOffline(false);
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        state.pin = '';
        save();
        show('screen-pin');
        throw new ApiError(data.error || 'PIN incorrecto', 401);
      }
      if (!res.ok || data.ok === false) throw new ApiError(data.error || 'Error ' + res.status, res.status);
      return data;
    } catch (e) {
      if (!(e instanceof ApiError)) {
        setOffline(true);
        throw new ApiError('Sin conexión con la caja', 0);
      }
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  function setOffline(offline) { $('offline').hidden = !offline; }

  // ============ NAVEGACION ============
  function show(screen) {
    if ((screen === 'screen-menu' || screen === 'screen-carrito') && !state.mesa) screen = 'screen-mesa';
    if (screen !== 'screen-pin' && !state.pin) screen = 'screen-pin';
    state.screen = screen;
    document.querySelectorAll('.screen').forEach((s) => { s.hidden = s.id !== screen; });
    const step = { 'screen-mesa': 1, 'screen-menu': 2, 'screen-carrito': 3 }[screen] || 0;
    $('steps').hidden = step === 0;
    [1, 2, 3].forEach((i) => { $('step' + i).className = 'step' + (i < step ? ' done' : i === step ? ' active' : ''); });
    $('header-mesa').textContent = state.mesa ? '🍽️ ' + state.mesa : '';
    updateFab();
    if (screen === 'screen-mesa') loadMesas();
    if (screen === 'screen-menu') { renderMenu(); loadPlatosMesa(); }
    if (screen === 'screen-carrito') { renderCart(); loadCurrentOrder(); }
    window.scrollTo(0, 0);
  }

  // ============ PIN ============
  $('pin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    state.pin = $('pin-input').value.trim();
    if (!state.pin) return;
    try {
      await api('/api/ping');
      save();
      $('pin-input').value = '';
      await loadMenu();
      show(state.mesa ? 'screen-menu' : 'screen-mesa');
    } catch (err) {
      toast(err.message, 'error');
    }
  });

  // ============ MESAS ============
  async function loadMesas() {
    try {
      state.mesas = await api('/api/mesas');
      renderMesas();
    } catch (e) {
      if (e.status !== 401 && !state.mesas.length) {
        $('mesa-grid').replaceChildren(h('p', { class: 'muted' }, e.message));
      }
    }
  }

  function renderMesas() {
    const grid = $('mesa-grid');
    const open = state.mesas.filter((m) => !m.pagado);
    if (!state.mesas.length) {
      grid.replaceChildren(h('p', { class: 'muted' }, 'No hay mesas abiertas. Crea una con el botón de abajo.'));
      return;
    }
    const cards = [...open, ...state.mesas.filter((m) => m.pagado)].map((m) => h('button', {
      type: 'button',
      class: 'mesa-btn' + (m.nombre === state.mesa ? ' selected' : ''),
      disabled: m.pagado,
      onclick: () => selectMesa(m.nombre),
    },
      h('span', { class: 'mesa-icon' }, m.pagado ? '✅' : m.tipo === 'Para llevar' ? '🛵' : '🍽️'),
      h('span', { class: 'mesa-num' }, m.numero),
      h('span', { class: 'mesa-name' }, m.nombre),
      h('span', { class: 'mesa-meta' }, m.pagado ? 'Pagado' : `${m.items} ítems · ${money(m.total)}`),
    ));
    grid.replaceChildren(...cards);
  }

  function selectMesa(nombre) {
    if (state.mesa !== nombre && state.cart.length) {
      if (!confirm(`Tienes ${cartUnits()} platillo(s) sin enviar para ${state.mesa}. ¿Pasarlos a ${nombre}?`)) return;
    }
    if (state.mesa !== nombre) {
      state.plato = 1;
      state.platosMesa = [];
    }
    state.mesa = nombre;
    save();
    show('screen-menu');
  }

  $('btn-refresh').addEventListener('click', loadMesas);
  $('btn-new-mesa').addEventListener('click', () => {
    $('new-mesa-form').hidden = false;
    $('btn-new-mesa').hidden = true;
    $('new-mesa-name').focus();
  });
  $('new-mesa-type').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tipo]');
    if (!btn) return;
    state.newMesaTipo = btn.dataset.tipo;
    $('new-mesa-type').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
  });
  $('new-mesa-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nombre = $('new-mesa-name').value.trim();
    if (!nombre) return toast('Escribe el nombre de la mesa', 'error');
    try {
      const data = await api('/api/mesas', { method: 'POST', body: JSON.stringify({ nombre, tipo: state.newMesaTipo }) });
      $('new-mesa-name').value = '';
      $('new-mesa-form').hidden = true;
      $('btn-new-mesa').hidden = false;
      toast(`Mesa ${data.mesa.numero} creada`, 'success');
      selectMesa(data.mesa.nombre);
    } catch (err) {
      toast(err.message, 'error');
    }
  });

  // ============ MENU ============
  async function loadMenu() {
    try {
      const [menu, ajustes] = await Promise.all([api('/api/menu'), api('/api/ajustes').catch(() => null)]);
      state.menu = menu;
      if (ajustes) state.ajustes = ajustes;
    } catch (e) {
      if (e.status !== 401) toast('No se pudo cargar el menú: ' + e.message, 'error');
    }
  }

  function renderMenu() {
    const categorias = Object.keys(state.menu);
    if (!categorias.includes(state.categoria)) state.categoria = categorias[0] || null;
    $('cat-tabs').replaceChildren(...categorias.map((cat) => h('button', {
      type: 'button',
      class: 'cat-tab' + (cat === state.categoria ? ' active' : ''),
      onclick: () => { state.categoria = cat; $('search').value = ''; renderMenu(); },
    }, cat)));
    renderPlateBar();
    renderPlatillos();
  }

  // ============ PLATOS ============
  // Los tacos se piden por unidad: el plato le dice a cocina como servirlos
  const usaPlato = (categoria) => !(state.ajustes.categorias_sin_plato || [])
    .some((c) => normalize(c) === normalize(categoria));
  const platoDe = (categoria) => (usaPlato(categoria) ? state.plato : 0);
  const platoLabel = (p) => (p ? `Plato ${p}` : 'Sin plato');
  const platosDeItems = (items) => [...new Set(items.map((i) => i.plato || 0))].filter(Boolean);

  function platosEnUso() {
    const set = new Set([...state.platosMesa, ...platosDeItems(state.cart), state.plato]);
    set.delete(0);
    return [...set].sort((a, b) => a - b);
  }

  function elegirPlato(plato) {
    state.plato = plato;
    save();
    renderPlateBar();
    renderPlatillos();
  }

  function renderPlateBar() {
    const platos = platosEnUso();
    const siguiente = (platos.length ? Math.max(...platos) : 0) + 1;
    const chip = (plato, text, extra = '') => h('button', {
      type: 'button',
      class: 'plate-chip' + extra + (state.plato === plato ? ' active' : ''),
      onclick: () => elegirPlato(plato),
    }, text);
    $('plate-bar').replaceChildren(
      h('span', { class: 'plate-bar-label' }, '🍽️ Plato:'),
      ...platos.map((p) => chip(p, String(p))),
      siguiente <= state.ajustes.max_platos ? chip(siguiente, '+ Nuevo', ' plate-new') : null,
      chip(0, 'Sin plato'),
    );
    $('plate-hint').textContent = state.plato
      ? `Lo que toques va al Plato ${state.plato}. Bebidas y jugos van aparte.`
      : 'Lo que toques va sin plato (para compartir).';
  }

  async function loadPlatosMesa() {
    const mesa = state.mesa;
    try {
      const pedido = await api('/api/pedido/' + encodeURIComponent(mesa));
      if (state.mesa !== mesa) return;
      state.platosMesa = platosDeItems(pedido.items);
      renderPlateBar();
    } catch (e) { /* la barra funciona igual sin los platos que ya tiene la mesa */ }
  }

  // Devuelve [[plato, [[item, indice], ...]], ...] con los platos en orden y "sin plato" al final
  function agruparPorPlato(items) {
    const grupos = new Map();
    items.forEach((item, idx) => {
      const plato = item.plato || 0;
      if (!grupos.has(plato)) grupos.set(plato, []);
      grupos.get(plato).push([item, idx]);
    });
    return [...grupos.entries()].sort(([a], [b]) => (a === 0) - (b === 0) || a - b);
  }

  const plateHeader = (plato) =>
    h('div', { class: 'plate-header' }, plato ? `🍽️ Plato ${plato}` : 'Sin plato (bebidas y para compartir)');

  const normalize = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  function renderPlatillos() {
    const list = $('platillo-list');
    const query = normalize($('search').value.trim());
    const cards = [];
    for (const [categoria, platillos] of Object.entries(state.menu)) {
      if (!query && categoria !== state.categoria) continue;
      for (const [platillo, variantes] of Object.entries(platillos)) {
        const entries = Object.entries(variantes).filter(([variante]) =>
          !query || normalize(`${platillo} ${variante}`).includes(query));
        if (!entries.length) continue;
        cards.push(h('div', { class: 'platillo-card' },
          h('div', { class: 'platillo-name' }, platillo,
            query ? h('span', { class: 'platillo-cat' }, categoria) : null),
          h('div', { class: 'variante-list' }, entries.map(([variante, precio]) => {
            const count = unitsFor(categoria, platillo, variante);
            return h('button', {
              type: 'button', class: 'variante-btn',
              onclick: (e) => addToCart(categoria, platillo, variante, precio, e.currentTarget),
            },
              variante, h('span', { class: 'precio-tag' }, money(precio)),
              count ? h('span', { class: 'count-badge' }, count) : null);
          })),
        ));
      }
    }
    if (!cards.length) {
      cards.push(h('p', { class: 'muted center' },
        Object.keys(state.menu).length ? 'Sin resultados.' : 'Menú no disponible.'));
    }
    list.replaceChildren(...cards);
  }

  $('search').addEventListener('input', renderPlatillos);

  // ============ CARRITO ============
  const cartUnits = () => state.cart.reduce((n, l) => n + l.cantidad, 0);
  // Cuantos hay en el carrito para el plato elegido
  const unitsFor = (categoria, platillo, variante) => state.cart
    .filter((l) => l.categoria === categoria && l.platillo === platillo && l.variante === variante
      && (l.plato || 0) === platoDe(categoria))
    .reduce((n, l) => n + l.cantidad, 0);

  function cartChanged() {
    state.requestId = null;
    save();
    updateFab();
  }

  const sameLine = (a, b) => a.categoria === b.categoria && a.platillo === b.platillo
    && a.variante === b.variante && (a.nota || '') === (b.nota || '') && (a.plato || 0) === (b.plato || 0);

  function addToCart(categoria, platillo, variante, precio, btn) {
    const nueva = { categoria, platillo, variante, precio, nota: '', cantidad: 1, plato: platoDe(categoria) };
    const line = state.cart.find((l) => sameLine(l, nueva));
    if (line) line.cantidad += 1;
    else state.cart.push(nueva);
    cartChanged();
    if (navigator.vibrate) navigator.vibrate(15);
    btn.classList.add('flash');
    setTimeout(renderPlatillos, 180);
  }

  function updateFab() {
    const units = cartUnits();
    $('fab-badge').textContent = units;
    $('fab-carrito').hidden = !(units > 0 && state.screen === 'screen-menu');
  }

  function renderCart() {
    const body = $('carrito-body');
    const units = cartUnits();
    $('cart-count').textContent = units ? `${units} ítem(s)` : '';
    $('btn-enviar').disabled = !units;
    if (!units) {
      body.replaceChildren(h('p', { class: 'muted center' }, '🛒 Todavía no agregaste platillos.'));
      return;
    }
    const total = state.cart.reduce((sum, l) => sum + l.precio * l.cantidad, 0);
    const platos = platosEnUso();
    const maxOpcion = Math.min((platos.length ? Math.max(...platos) : 0) + 1, state.ajustes.max_platos);
    const conPlatos = state.cart.some((l) => l.plato);
    const rows = [];
    for (const [plato, lineas] of agruparPorPlato(state.cart)) {
      if (conPlatos) rows.push(plateHeader(plato));
      for (const [line, idx] of lineas) rows.push(renderCartLine(line, idx, maxOpcion));
    }
    body.replaceChildren(
      ...rows,
      h('div', { class: 'total-row' }, h('span', {}, 'Total a enviar'), h('span', {}, money(total))),
    );
  }

  function renderCartLine(line, idx, maxOpcion) {
    let plateSelect = null;
    if (usaPlato(line.categoria)) {
      const opciones = [];
      for (let p = 0; p <= maxOpcion; p++) {
        opciones.push(h('option', { value: String(p), selected: (line.plato || 0) === p }, platoLabel(p)));
      }
      plateSelect = h('select', {
        class: 'plate-select', 'aria-label': 'Plato',
        onchange: (e) => moveLineToPlate(idx, Number(e.target.value)),
      }, opciones);
    }
    return h('div', { class: 'line' },
      h('div', { class: 'line-top' },
        h('div', { class: 'line-name' }, line.platillo, h('small', {}, line.variante)),
        h('div', { class: 'qty' },
          h('button', { type: 'button', 'aria-label': 'Quitar uno', onclick: () => changeQty(idx, -1) }, '−'),
          h('span', {}, line.cantidad),
          h('button', { type: 'button', 'aria-label': 'Agregar uno', onclick: () => changeQty(idx, 1) }, '+'),
        ),
        h('div', { class: 'line-price' }, money(line.precio * line.cantidad)),
      ),
      h('div', { class: 'line-bottom' },
        plateSelect,
        h('input', {
          type: 'text', class: 'note-input', maxLength: 120, value: line.nota,
          placeholder: '📝 Nota (sin cebolla...)',
          onchange: (e) => { line.nota = e.target.value.trim(); cartChanged(); },
        }),
      ),
    );
  }

  function moveLineToPlate(idx, plato) {
    const line = state.cart[idx];
    line.plato = plato;
    // Si ese plato ya tenia la misma linea, se juntan
    const twin = state.cart.findIndex((l, i) => i !== idx && sameLine(l, line));
    if (twin >= 0) {
      state.cart[twin].cantidad += line.cantidad;
      state.cart.splice(idx, 1);
    }
    cartChanged();
    renderCart();
  }

  function changeQty(idx, delta) {
    const line = state.cart[idx];
    line.cantidad += delta;
    if (line.cantidad <= 0) state.cart.splice(idx, 1);
    cartChanged();
    renderCart();
  }

  async function loadCurrentOrder() {
    const card = $('current-order-card');
    try {
      const pedido = await api('/api/pedido/' + encodeURIComponent(state.mesa));
      state.platosMesa = platosDeItems(pedido.items);
      renderCart();
      if (!pedido.items.length) { card.hidden = true; return; }
      $('current-order-total').textContent = money(pedido.total);
      const conPlatos = pedido.items.some((i) => i.plato);
      const rows = [];
      for (const [plato, items] of agruparPorPlato(pedido.items)) {
        if (conPlatos) rows.push(plateHeader(plato));
        for (const [item] of items) {
          rows.push(h('div', { class: 'line' },
            h('div', { class: 'line-top' },
              h('div', { class: 'line-name' }, `${item.cantidad}× ${item.platillo}`,
                h('small', {}, item.variante),
                item.nota ? h('span', { class: 'note-tag' }, '📝 ' + item.nota) : null),
              h('div', { class: 'line-price' }, money(item.subtotal)),
            ),
          ));
        }
      }
      $('current-order-body').replaceChildren(...rows);
      card.hidden = false;
      if (pedido.pagado) toast('Esta mesa ya fue cobrada. Elige otra.', 'error');
    } catch (e) {
      card.hidden = true;
      if (e.status === 404) {
        toast('La mesa ya no existe en la caja', 'error');
        state.mesa = null;
        save();
        show('screen-mesa');
      }
    }
  }

  $('btn-enviar').addEventListener('click', async () => {
    if (!state.cart.length || !state.mesa) return;
    const btn = $('btn-enviar');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    // Mismo id en cada reintento: si la caja ya lo recibio no se duplica
    if (!state.requestId) {
      state.requestId = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      save();
    }
    try {
      const data = await api('/api/pedido/' + encodeURIComponent(state.mesa) + '/items', {
        method: 'POST',
        body: JSON.stringify({ request_id: state.requestId, items: state.cart }),
      });
      toast('✅ ' + data.mensaje, 'success');
      state.cart = [];
      state.requestId = null;
      const mesa = state.mesa;
      state.mesa = null;
      save();
      setTimeout(() => { if (!state.mesa || state.mesa === mesa) show('screen-mesa'); }, 1200);
    } catch (e) {
      toast('⚠️ ' + e.message + (e.status === 0 ? '. Toca enviar de nuevo.' : ''), 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '✅ Enviar a la caja';
    }
  });

  document.querySelectorAll('[data-go]').forEach((btn) =>
    btn.addEventListener('click', () => show(btn.dataset.go)));
  $('fab-carrito').addEventListener('click', () => show('screen-carrito'));

  // ============ TOAST ============
  let toastTimer = null;
  function toast(message, type = '') {
    const t = $('toast');
    t.textContent = message;
    t.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, 2800);
  }

  // ============ INIT ============
  const syncHeaderHeight = () =>
    document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight + 'px');
  new ResizeObserver(syncHeaderHeight).observe(document.querySelector('header'));
  load();
  setInterval(() => {
    if (state.screen === 'screen-mesa' && !document.hidden) loadMesas();
  }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.screen === 'screen-mesa') loadMesas();
  });

  (async () => {
    if (!state.pin) return show('screen-pin');
    await loadMenu();
    if (state.pin) show(state.mesa ? (state.cart.length ? 'screen-carrito' : 'screen-menu') : 'screen-mesa');
  })();
</script>
</body>
</html>
